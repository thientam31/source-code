<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-color: #f2f2f2;
      --btn-color: #04AA6D;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #ffffff;
        --card-color: #1e1e1e;
        --btn-color: #4CAF50;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
    }

    #qrcode {
      margin: 20px 0;
      background: var(--card-color);
      padding: 20px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 80%;
      max-width: 400px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--btn-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background-color: #037c4c;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <h1>🔳 QR Code Generator</h1>
  <div id="qrcode"></div>
  
  <input type="text" id="text" placeholder="Enter text or URL here" />
  <div class="buttons">
    <button onclick="generateQRCode()">Generate</button>
    <button onclick="downloadQR()">Download PNG</button>
  </div>

  <script>
    let currentText = "";

    function generateQRCode() {
      const input = document.getElementById("text").value.trim();
      if (!input) return alert("Please enter text or a URL.");
      currentText = input;

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      QRCode.toCanvas(input, { width: 256, margin: 2 }, function (err, canvas) {
        if (err) console.error(err);
        else qrContainer.appendChild(canvas);
      });
    }

    function downloadQR() {
      if (!currentText) return alert("Generate a QR code first.");
      const canvas = document.querySelector("#qrcode canvas");
      const link = document.createElement("a");
      link.download = "qrcode.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
